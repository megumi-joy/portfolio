<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Voicy | AI Synthetic Cognition</title>
		<style>
            @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');

            html, body, #canvas {
                margin: 0;
                padding: 0;
                border: 0;
            }

            body {
                color: #e0faff;
                background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
                overflow: hidden;
                touch-action: none;
                font-family: 'Outfit', sans-serif;
            }

            #canvas {
                display: block;
            }

            #canvas:focus {
                outline: none;
            }

            #status {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: #0c0c14;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                visibility: visible;
                z-index: 1000;
                transition: opacity 0.5s ease-out, visibility 0.5s;
            }

            #status-splash {
                max-height: 250px;
                max-width: 80%;
                margin-bottom: 2rem;
                filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.4));
                animation: pulse 4s infinite ease-in-out;
            }

            @keyframes pulse {
                0% { transform: scale(1.0); filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.4)); }
                50% { transform: scale(1.05); filter: drop-shadow(0 0-40px rgba(0, 255, 255, 0.7)); }
                100% { transform: scale(1.0); filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.4)); }
            }

            #status-progress-container {
                width: 300px;
                height: 4px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 20px;
                overflow: hidden;
                margin-top: 10px;
                position: relative;
                border: 1px solid rgba(0, 255, 255, 0.2);
            }

            #status-progress {
                height: 100%;
                width: 0%;
                background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
                box-shadow: 0 0 10px #00d2ff;
                transition: width 0.2s ease;
            }

            #status-text {
                margin-top: 20px;
                font-size: 0.9rem;
                letter-spacing: 2px;
                text-transform: uppercase;
                color: #00d2ff;
                font-weight: 300;
            }

            #status-notice {
                position: absolute;
                bottom: 20px;
                background-color: rgba(180, 50, 50, 0.2);
                border: 1px solid #ff4b2b;
                color: #ff4b2b;
                padding: 10px 20px;
                border-radius: 4px;
                display: none;
                max-width: 80%;
                text-align: center;
            }

            .lang-switch {
                position: absolute;
                top: 20px;
                right: 20px;
                display: flex;
                gap: 10px;
            }

            .lang-btn {
                background: none;
                border: 1px solid rgba(0, 255, 255, 0.3);
                color: rgba(0, 255, 255, 0.6);
                padding: 5px 10px;
                cursor: pointer;
                font-size: 0.7rem;
                transition: all 0.3s;
                border-radius: 4px;
            }

            .lang-btn.active, .lang-btn:hover {
                background: rgba(0, 255, 255, 0.1);
                color: #00d2ff;
                border-color: #00d2ff;
            }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
            <div class="lang-switch">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="es">ES</button>
                <button class="lang-btn" data-lang="ru">RU</button>
            </div>
			<img id="status-splash" src="index.png" alt="Voicy Logo">
            <div id="status-progress-container">
                <div id="status-progress"></div>
            </div>
			<div id="status-text" data-i18n="loader_init">Initializing Cognition...</div>
			<div id="status-notice"></div>
		</div>

        <script src="i18n.js"></script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":62048656,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
    const statusText = document.getElementById('status-text');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;

	function setStatusMode(mode) {
		if (!initializing) return;
		if (mode === 'hidden') {
			statusOverlay.style.opacity = '0';
            setTimeout(() => {
                statusOverlay.style.visibility = 'hidden';
            }, 500);
			initializing = false;
			return;
		}
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occured');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
        displayFailureNotice('Fatal Error: Your browser is missing core WebGL 2.0 or Wasm features.');
	} else {
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.style.width = (current / total * 100) + '%';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
